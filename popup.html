<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chrome Fiddler</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      width: 400px;
      height: 520px; /* Slightly taller for better spacing */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border-bottom: 1px solid var(--surface-border);
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--accent), #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.025em;
    }
    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .utility-group {
      display: flex;
      gap: 0.5rem;
    }
    
    #requestList {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .request-card {
      padding: 1rem;
      border-radius: var(--radius-lg);
      transition: all 0.2s ease;
      position: relative;
    }
    .request-card:hover { border-color: var(--accent); transform: scale(1.02); }
    .method-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      background: var(--accent-glow);
      color: var(--accent);
    }
    .url-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      word-break: break-all;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>FIDDLER</h1>
      <div class="utility-group">
        <button id="openManager" class="btn btn-ghost" title="Open Dashboard" style="font-size: 0.7rem;">↗ Dash</button>
        <button id="downloadBtn" class="btn btn-ghost" title="Download Session cURLs" style="font-size: 0.7rem;">⬇ DL</button>
        <button id="clearBtn" class="btn btn-ghost" title="Clear All Logs" style="font-size: 0.7rem; color: var(--danger);">🗑️ Clear</button>
      </div>
    </div>
    <div class="action-group" style="grid-template-columns: 1fr;">
      <button id="startBtn" class="btn btn-primary" style="padding: 1rem; font-weight: 800; font-size: 1rem;">
        <span class="icon">⏺</span> START CAPTURE
      </button>
      <button id="stopBtn" class="btn btn-danger" style="display:none; padding: 1rem; font-weight: 800; font-size: 1rem;">
        <span class="icon">⏹</span> STOP CAPTURE
      </button>
    </div>
  </header>

  <div id="requestList">
    <!-- Requests will appear here -->
  </div>
  <script src="popup.js"></script>
</body>
</html>
